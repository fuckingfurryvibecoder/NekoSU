name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (leave empty for v0.1.<run number>)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare signing info
    runs-on: ubuntu-latest
    outputs:
      expected_size: ${{ steps.cert.outputs.size }}
      expected_hash: ${{ steps.cert.outputs.hash }}
    steps:
      - name: Compute certificate size and hash
        id: cert
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          keytool -exportcert -keystore release.jks -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" -file release.der
          SIZE_DEC=$(stat -c%s release.der)
          echo "size=$(printf '0x%04x' $SIZE_DEC)" >> $GITHUB_OUTPUT
          echo "hash=$(sha256sum release.der | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "Certificate size: $SIZE_DEC bytes"

  build-lkm:
    name: Build kernelsu.ko
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    uses: ./.github/workflows/ddk-lkm.yml
    with:
      kmi: ${{ matrix.kmi }}
      package_name: dev.nekosu
      expected_size: ${{ needs.prepare.outputs.expected_size }}
      expected_hash: ${{ needs.prepare.outputs.expected_hash }}

  build-ksud:
    name: Build ksud
    uses: ./.github/workflows/ksud.yml
    with:
      target: aarch64-linux-android

  build-manager:
    name: Build NekoSU APK
    needs: build-ksud
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit

  publish:
    name: Publish release
    needs: [build-lkm, build-manager]
    if: ${{ needs.build-manager.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Collect files
        run: |
          set -e
          mkdir -p dist
          find . -name "*.apk" -exec cp -f {} dist/ \;
          find . -name "*_kernelsu.ko" -exec cp -f {} dist/ \;
          cd dist
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || (inputs.tag != '' && inputs.tag || format('v0.1.{0}', github.run_number)) }}
          name: NekoSU ${{ github.ref_type == 'tag' && github.ref_name || (inputs.tag != '' && inputs.tag || format('v0.1.{0}', github.run_number)) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
          body: |
            ## NekoSU ${{ github.ref_type == 'tag' && github.ref_name || (inputs.tag != '' && inputs.tag || format('v0.1.{0}', github.run_number)) }}

            KernelSU-based root manager for Samsung devices (KDP / RKP / DEFEX aware).
            The module runs in **LKM mode**: the stock kernel stays untouched, but the boot
            image ramdisk is patched so `kernelsu.ko` loads at boot.

            **Requirements**

            - Unlocked bootloader. On Samsung this permanently trips Knox.
            - The `.ko` that matches your kernel branch.

            **Install**

            1. Check your kernel version: `adb shell uname -r`, or *Settings → About phone →
               Software information → Kernel version*. Pick the `.ko` with the matching KMI
               prefix, e.g. `android15-6.6` for a 6.6 kernel.
            2. Patch your boot image on a PC:

               ```sh
               ksud boot-patch --boot-image boot.img --kernel androidXX-Y.Z_kernelsu.ko --out patched.img
               ```

            3. Flash `patched.img` to the `boot` partition (Odin / `fastboot flash boot`).
            4. Install `NekoSU_*.apk`. Do not re-sign it — the kernel only trusts the
               NekoSU certificate.
            5. Reboot, open the app, verify with `su -c id`.

            > `insmod kernelsu.ko` only works if you already have root; it is not a way to
            > gain it. Non-GKI kernels (4.14 / 4.19) cannot load an LKM at all and need
            > KernelSU built into the kernel image.

            `SHA256SUMS.txt` contains checksums for every asset.

            > NekoSU is GPL-3.0. Sources: ${{ github.server_url }}/${{ github.repository }}
