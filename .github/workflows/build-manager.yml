name: Build Manager

on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      - '.github/workflows/build-manager.yml'
      - 'manager/**'

jobs:
  build-manager:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download ksud (if provided by caller)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ksud-aarch64-linux-android
          path: artifacts/ksud-aarch64-linux-android

      - name: Bundle ksud into the APK
        run: |
          set -e
          KSUD="$(find artifacts/ksud-aarch64-linux-android -type f -name ksud | head -n 1 || true)"
          if [ -n "$KSUD" ]; then
            mkdir -p app/src/main/jniLibs/arm64-v8a
            cp -f "$KSUD" app/src/main/jniLibs/arm64-v8a/libksud.so
            chmod +x app/src/main/jniLibs/arm64-v8a/libksud.so
            echo "Bundled ksud: $KSUD"
          else
            echo "::warning::ksud artifact not found - APK will be built without the root daemon"
          fi

      - name: Write signing config
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE secret is not set. NekoSU requires an APK signed with the same certificate that is baked into kernelsu.ko."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > key.jks
          {
            echo "KEYSTORE_FILE=key.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release APK
        run: ./gradlew assembleRelease -Pcommit=${{ github.sha }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: NekoSU-apk
          path: manager/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload mappings
        uses: actions/upload-artifact@v7
        with:
          name: NekoSU-mappings
          path: manager/app/build/outputs/mapping/release/
          if-no-files-found: ignore
